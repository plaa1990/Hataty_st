      <script>
      // กันหน้าขาว: ล้าง Service Worker/แคชเก่า และโชว์ error บนหน้าจอ
      (function () {
        try {
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs = rs.filter(function (r) { var a = r.active || r.waiting || r.installing; return !(a && /app-sw\.js$/.test(a.scriptURL)); });
              if (!rs.length) return;
              Promise.all(rs.map(function (r) { return r.unregister(); }))
                .then(function () { return window.caches ? caches.keys() : []; })
                .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
                .then(function () { if (!sessionStorage.getItem('sw-cleared')) { sessionStorage.setItem('sw-cleared', '1'); location.reload(); } });
            });
          }
        } catch (e) {}
        function show(msg) {
          var d = document.getElementById('err-overlay');
          if (!d) {
            d = document.createElement('pre');
            d.id = 'err-overlay';
            d.style.cssText = 'position:fixed;z-index:99999;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;margin:0;padding:12px;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap';
            document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
            if (document.body) document.body.appendChild(d);
          }
          d.textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) { show('ERROR: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
        window.addEventListener('unhandledrejection', function (e) { show('PROMISE: ' + (e.reason && e.reason.message || e.reason)); });
      })();
    </script>
      <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#e11d48" />

      <script>
      // ถ้าเปิดโฟลเดอร์หลักด้วยเซิร์ฟเวอร์ธรรมดา (ไม่ผ่าน Vite) แอพจะไม่ขึ้น -> พาไปเวอร์ชัน build ใน dist/ อัตโนมัติ
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.children.length && !document.getElementById('err-overlay')) {
          location.replace('./dist/index.html');
        }
      }, 2500);
    </script>
    <script src="./legacy/hatafuku-core.js"></script>

    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('./app-sw.js').catch(function () {}); });
      }
    </script>
